[workspace]
resolver = "3"
members = [
    "crates/glitcherz-model",
    "crates/glitcherz-command",
    "crates/glitcherz-engine",
    "crates/glitcherz-ui",
    "crates/glitcherz-app",
    "crates/glitcherz-test-plugin",
    "crates/glitcherz-test-vst3",
    "crates/glitcherz-clap-host",
    "crates/glitcherz-vst3-host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 音频设备
cpal = "0.18"
# 原生文件对话框（保存/打开项目）
rfd = "0.17"
# GUI（egui 框架）。默认关闭全部 feature；渲染后端由 glitcherz-ui 选择 glow。
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
# 实时无锁队列（UI → 音频线程）
rtrb = "0.4"
# 错误处理
thiserror = "2"
# 日志
log = "0.4"
env_logger = "0.11"
# 序列化（项目文件，RON）
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# CLAP 插件宿主（安全封装；插件加载仅在非实时线程）
clack-host = "0.2"
clack-common = "0.2"
clack-extensions = { version = "0.2", features = [
    "params",
    "note-ports",
    "audio-ports",
    "log",
    "tail",
    "clack-host",
] }
# 动态库加载（CLAP/VST3 插件扫描）
libloading = "0.8"
# VST3 插件宿主（COM 绑定，预生成，无需官方 SDK）
vst3 = "0.3"

clack-plugin = "0.2"
glitcherz-model = { path = "crates/glitcherz-model" }
glitcherz-command = { path = "crates/glitcherz-command" }
glitcherz-clap-host = { path = "crates/glitcherz-clap-host" }
glitcherz-vst3-host = { path = "crates/glitcherz-vst3-host" }
glitcherz-engine = { path = "crates/glitcherz-engine" }
glitcherz-ui = { path = "crates/glitcherz-ui" }

[profile.release]
lto = "thin"
