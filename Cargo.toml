[workspace]
resolver = "3"
members = [
    "crates/resoz-model",
    "crates/resoz-engine",
    "crates/resoz-ui",
    "crates/resoz-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 音频设备
cpal = "0.18"
# 实时无锁队列（UI → 音频线程）
rtrb = "0.4"
# 错误处理
thiserror = "2"
# 日志
log = "0.4"
env_logger = "0.11"
# 序列化（项目文件，RON）
serde = { version = "1", features = ["derive"] }
ron = "0.12"

resoz-model = { path = "crates/resoz-model" }
resoz-engine = { path = "crates/resoz-engine" }
resoz-ui = { path = "crates/resoz-ui" }

[profile.release]
lto = "thin"
