[workspace]
resolver = "3"
members = [
    "crates/glitcherz-model",
    "crates/glitcherz-command",
    "crates/glitcherz-engine",
    "crates/glitcherz-ui",
    "crates/glitcherz-app",
    "crates/glitcherz-test-plugin",
    "crates/glitcherz-test-vst3",
    "crates/glitcherz-clap-host",
    "crates/glitcherz-vst3-host",
]
# Vendored rustysynth-ext fork：独立构建（可用 .vendor/rustysynth-ext 内单独
# 跑 cargo），不作为 workspace member。
exclude = [".vendor/rustysynth-ext"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 音频设备
cpal = "0.18"
# 硬件 MIDI 输入（R3：端口枚举 + 输入回调，spec recording.md §3.2）
midir = "0.11"
# 原生文件对话框（保存/打开项目）
rfd = "0.17"
# GUI（egui 框架）。默认关闭全部 feature；渲染后端由 glitcherz-ui 选择 glow。
eframe = { version = "0.37", default-features = false, features = ["default_fonts"] }
# `egui` is declared for exactly one reason: egui 0.37 made the monochrome
# emoji fonts (NotoEmoji + emoji-icon-font) an opt-in feature and eframe does
# not forward it. Without them the bundled stack has no face at all for the
# media-control block (⏮ ⏸ ⏭ ⏺) or for ↩ ▸ ♪ — every one of those renders as
# the primary face's `.notdef` tofu. Cargo unifies features per crate, so this
# entry switches the fonts on inside eframe's own egui build too.
egui = { version = "0.37", default-features = false, features = [
    "monochrome_emoji_fonts",
] }
# 实时无锁队列（UI → 音频线程）
rtrb = "0.4"
# 实时无锁 MPMC 队列（R4：输入回调 → 图内 InputProcessor；图重建后句柄仍可共享）
crossbeam-queue = "0.3"
# 错误处理
thiserror = "2"
# 日志
log = "0.4"
env_logger = "0.11"
# 序列化（项目文件，RON）
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# CLAP 插件宿主（安全封装；插件加载仅在非实时线程）
clack-host = "0.2"
clack-common = "0.2"
clack-extensions = { version = "0.2", features = [
    "params",
    "note-ports",
    "audio-ports",
    "log",
    "tail",
    "state",
    "gui",
    "latency",
    "clack-host",
] }
# 动态库加载（CLAP/VST3 插件扫描）
libloading = "0.8"
# VST3 插件宿主（COM 绑定，预生成，无需官方 SDK）
vst3 = "0.3"

clack-plugin = "0.2"
# Win32 子窗口容器（插件 GUI 嵌入，仅 Windows 构建）
windows-sys = "0.60"
# 原生窗口句柄提取（eframe 主窗口 HWND；与 eframe 0.36 的传递依赖同版本）
raw-window-handle = "0.6"
# SF2/SF3 音色库合成（纯 Rust、零 unsafe；S6 起 sf3 feature 常开——Vorbis 解码
# 只发生在加载期控制线程，RT 热路径仍零分配）。
# Vendored fork：修复 preset zone 合并语义（覆盖 + 仅 initialAttenuation 相加，
# SF2 2.04 §8.5.2），待上游合入后切回 registry 版本。
rustysynth-ext = { path = ".vendor/rustysynth-ext", features = ["sf3"] }
# wav 解码（U5 采样播放器 / U6 audio track 共用；纯 Rust 零 unsafe，
# 解码只在控制线程 sample 模块，RT 路径不 touch）
hound = "3.5"
# Compressed audio decoding (X series, spec .agents/spec/audio-decoding.md).
# Pure Rust, decode-only, MPL-2.0. Default features pull SIMD/rustfft and
# metadata readers we do not need, so codecs and containers are explicit.
# WAV keeps using hound for byte-for-byte zero regression; "wav"/"pcm" are
# enabled here for the symphonia-side parity test and exotic-WAV fallback.
symphonia = { version = "0.6.1", default-features = false, features = [
    "flac", "mp3", "mpa", "ogg", "vorbis", "aac", "isomp4", "aiff", "pcm", "wav",
] }
glitcherz-model = { path = "crates/glitcherz-model" }
glitcherz-command = { path = "crates/glitcherz-command" }
glitcherz-clap-host = { path = "crates/glitcherz-clap-host" }
glitcherz-vst3-host = { path = "crates/glitcherz-vst3-host" }
glitcherz-engine = { path = "crates/glitcherz-engine" }
glitcherz-ui = { path = "crates/glitcherz-ui" }

[profile.release]
lto = "thin"
