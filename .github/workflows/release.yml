name: Release

# Pushing a tag like v0.1.0 runs the preflight gate, builds the app on every
# desktop target, then publishes one GitHub Release with all archives plus a
# combined sha256sums.txt.
#
# The tag must match the workspace version in Cargo.toml -- bump the version,
# commit, then tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Tag that triggered the run, e.g. v0.1.0. Used in artifact names.
  VERSION: ${{ github.ref_name }}

jobs:
  # Gate: a tag that does not pass format / lint / tests is never published.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: preflight
      - name: Check tag matches workspace version
        run: |
          version=$(awk '/^\[workspace.package\]/{f=1} f && /^version *=/{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)
          echo "Cargo.toml: $version | tag: $VERSION"
          if [ "v$version" != "$VERSION" ]; then
            echo "::error::tag $VERSION does not match workspace version v$version"
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # Per-platform builds. Every job only produces a workflow artifact; all
  # release uploads happen once in `publish`, so a re-run of a single target
  # can never leave the release asset set in a half-updated state.
  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64. Built on 22.04 on purpose: the binary inherits that
          # glibc (2.35) and therefore runs on more distros than one built on
          # ubuntu-latest (24.04).
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bin: target/x86_64-unknown-linux-gnu/release/glitcherz
          # Windows x86_64.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bin: target/x86_64-pc-windows-msvc/release/glitcherz.exe
          # macOS universal (arm64 runner cross-builds the Intel half, then
          # lipo merges both slices into one binary). macos-14 is retired,
          # macos-15 is the current arm64 stable image.
          - name: macos-universal
            os: macos-15
            target: universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bin: target/glitcherz-universal

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build (Linux / Windows)
        if: matrix.target != 'universal'
        run: cargo build --release --locked --target ${{ matrix.target }} -p glitcherz-app

      - name: Build (macOS universal)
        if: matrix.target == 'universal'
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin -p glitcherz-app
          cargo build --release --locked --target x86_64-apple-darwin -p glitcherz-app
          lipo -create \
            target/aarch64-apple-darwin/release/glitcherz \
            target/x86_64-apple-darwin/release/glitcherz \
            -output target/glitcherz-universal
          lipo -archs target/glitcherz-universal

      # Archive layout: a top-level directory so extracting never scatters the
      # binary over the user's cwd. macOS gets a real `.app` below instead, so
      # Finder users can drag it into /Applications.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/glitcherz-${VERSION}-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "${{ matrix.bin }}" "$stage/"
          cp README.md "$stage/"
          cp docs/manual.md docs/shortcuts.md "$stage/"
          # Font licence: OFL 1.1 requires the notice to travel with the binary.
          cp THIRD-PARTY-NOTICES.md "$stage/"
          tar -czf "$stage.tar.gz" -C dist "$(basename "$stage")"
          # Only the archive is uploaded; drop the staging tree.
          rm -rf "$stage"
          ls -l dist

      # macOS ships a real `.app` bundle. `ditto` keeps permissions and the
      # ad-hoc signature intact; the docs ride in Contents/Resources so the
      # OFL notice still travels with the code.
      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="dist/GlitcherZ.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "${{ matrix.bin }}" "$app/Contents/MacOS/glitcherz"
          chmod +x "$app/Contents/MacOS/glitcherz"
          cp README.md THIRD-PARTY-NOTICES.md "$app/Contents/Resources/"
          cp docs/manual.md docs/shortcuts.md docs/project-files.md "$app/Contents/Resources/"
          # Apple version strings only take numeric components; the tag may
          # carry a pre-release suffix (0.1.0-preview.1 -> 0.1.0).
          short="${VERSION#v}"
          short="$(printf '%s' "$short" | sed -E 's/[^0-9.].*$//')"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>GlitcherZ</string>
            <key>CFBundleDisplayName</key><string>GlitcherZ</string>
            <key>CFBundleIdentifier</key><string>app.glitcherz.GlitcherZ</string>
            <key>CFBundleExecutable</key><string>glitcherz</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${short}</string>
            <key>CFBundleVersion</key><string>${short}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.music</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          # `lipo` invalidates the linker's per-slice signature, and Apple
          # Silicon refuses unsigned code. Ad-hoc signing is enough for a
          # locally built, unnotarized app (no Developer ID here).
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/glitcherz"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "dist/glitcherz-${VERSION}-macos-universal.zip"
          rm -rf "$app"
          ls -l dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/glitcherz-${{ env.VERSION }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ matrix.bin }}" $stage
          Copy-Item "README.md" $stage
          Copy-Item "docs/manual.md", "docs/shortcuts.md" $stage
          # Font licence: OFL 1.1 requires the notice to travel with the binary.
          Copy-Item "THIRD-PARTY-NOTICES.md" $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          # Only the archive is uploaded; drop the staging tree.
          Remove-Item -Recurse -Force $stage
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # Single publish point: download every archive, checksum them, compose the
  # release body from the commit log since the previous tag, create the release.
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Glob is anchored to glitcherz-* so the checksum file never lists itself.
      - name: Generate combined checksums
        run: |
          cd dist
          sha256sum glitcherz-* > sha256sums.txt
          cat sha256sums.txt

      - name: Compose release notes
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
            header="Commits since \`$prev\`:"
          else
            range="HEAD"
            header="First tagged build."
          fi
          # Literal "\n" sequences (a few old commit subjects have them) are
          # folded to spaces; super long subjects are clipped so one commit
          # cannot dominate the page.
          commits() {
            git log --no-merges --pretty='- %s (%h)' "$range" | sed -e 's/\\n/ /g' | cut -c1-160
          }
          {
            echo "## Changes"
            echo
            echo "$header"
            echo
            commits
            echo
            echo "## Downloads"
            echo
            echo "| Platform | Archive |"
            echo "| :--- | :--- |"
            echo "| Windows x86_64 | \`glitcherz-$VERSION-windows-x86_64.zip\` |"
            echo "| macOS (Apple Silicon + Intel) | \`glitcherz-$VERSION-macos-universal.zip\` (contains \`GlitcherZ.app\`) |"
            echo "| Linux x86_64 | \`glitcherz-$VERSION-linux-x86_64.tar.gz\` |"
            echo
            echo "Verify with \`sha256sum -c sha256sums.txt\` (Windows: \`Get-FileHash\`)."
            echo
            echo "## Runtime requirements"
            echo
            echo "- **macOS**: unzip and drag \`GlitcherZ.app\` into \`/Applications\`. The build is **not notarized** (no Apple Developer certificate), so Gatekeeper blocks the first launch. Open **System Settings → Privacy & Security**, click **Open Anyway** next to *GlitcherZ*, then confirm. On older macOS, right-clicking the app → *Open* also works. Terminal fallback: \`xattr -dr com.apple.quarantine /Applications/GlitcherZ.app\`. This is needed once; nothing is sent anywhere."
            echo "- **macOS CLI**: the command-line tools live inside the bundle — \`/Applications/GlitcherZ.app/Contents/MacOS/glitcherz --render in.glz out.wav\` (also \`--ops\` / \`--mcp\`)."
            echo "- **Windows**: unzip and run \`glitcherz.exe\`; when SmartScreen warns, click *More info* → *Run anyway*."
            echo "- **Linux**: nothing extra to unpack — extract the \`tar.gz\` and run \`./glitcherz\`. Needs ALSA, OpenGL and an X11 or Wayland session, e.g. on Debian/Ubuntu:"
            echo "  \`sudo apt install libasound2 libgl1 libxkbcommon0 libwayland-client0\`."
            echo "- CLAP / VST3 plugins are optional; point GlitcherZ at your plugin folders in the app."
            echo
            echo "## License"
            echo
            echo "GlitcherZ is MIT OR Apache-2.0. The bundled Noto Sans SC font subset is under the SIL Open Font License 1.1; both notices ship in \`THIRD-PARTY-NOTICES.md\` inside each archive."
          } > NOTES.md
          cat NOTES.md

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: GlitcherZ ${{ env.VERSION }}
          body_path: NOTES.md
          files: |
            dist/glitcherz-*
            dist/sha256sums.txt
          fail_on_unmatched_files: true
          draft: false
          # Semver prerelease tags (e.g. v0.1.0-preview.1) become GitHub
          # pre-releases; plain tags like v0.1.0 stay full releases.
          prerelease: auto
