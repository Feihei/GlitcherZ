name: Release

# Pushing a tag like v0.1.0 runs the preflight gate, builds the app on every
# desktop target, then publishes one GitHub Release with all archives plus a
# combined sha256sums.txt.
#
# The tag must match the workspace version in Cargo.toml -- bump the version,
# commit, then tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Tag that triggered the run, e.g. v0.1.0. Used in artifact names.
  VERSION: ${{ github.ref_name }}

jobs:
  # Gate: a tag that does not pass format / lint / tests is never published.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: preflight
      - name: Check tag matches workspace version
        run: |
          version=$(awk '/^\[workspace.package\]/{f=1} f && /^version *=/{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)
          echo "Cargo.toml: $version | tag: $VERSION"
          if [ "v$version" != "$VERSION" ]; then
            echo "::error::tag $VERSION does not match workspace version v$version"
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # Per-platform builds. Every job only produces a workflow artifact; all
  # release uploads happen once in `publish`, so a re-run of a single target
  # can never leave the release asset set in a half-updated state.
  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64. Built on 22.04 on purpose: the binary inherits that
          # glibc (2.35) and therefore runs on more distros than one built on
          # ubuntu-latest (24.04).
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bin: target/x86_64-unknown-linux-gnu/release/glitcherz
          # Windows x86_64.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bin: target/x86_64-pc-windows-msvc/release/glitcherz.exe
          # macOS universal (arm64 runner cross-builds the Intel half, then
          # lipo merges both slices into one binary).
          - name: macos-universal
            os: macos-14
            target: universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bin: target/glitcherz-universal

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build (Linux / Windows)
        if: matrix.target != 'universal'
        run: cargo build --release --locked --target ${{ matrix.target }} -p glitcherz-app

      - name: Build (macOS universal)
        if: matrix.target == 'universal'
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin -p glitcherz-app
          cargo build --release --locked --target x86_64-apple-darwin -p glitcherz-app
          lipo -create \
            target/aarch64-apple-darwin/release/glitcherz \
            target/x86_64-apple-darwin/release/glitcherz \
            -output target/glitcherz-universal
          lipo -archs target/glitcherz-universal

      # Archive layout: a top-level directory so extracting never scatters the
      # binary over the user's cwd.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/glitcherz-${VERSION}-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "${{ matrix.bin }}" "$stage/"
          cp README.md "$stage/"
          tar -czf "$stage.tar.gz" -C dist "$(basename "$stage")"
          # Only the archive is uploaded; drop the staging tree.
          rm -rf "$stage"
          ls -l dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/glitcherz-${{ env.VERSION }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ matrix.bin }}" $stage
          Copy-Item "README.md" $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          # Only the archive is uploaded; drop the staging tree.
          Remove-Item -Recurse -Force $stage
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # Single publish point: download every archive, checksum them, compose the
  # release body from the commit log since the previous tag, create the release.
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Glob is anchored to glitcherz-* so the checksum file never lists itself.
      - name: Generate combined checksums
        run: |
          cd dist
          sha256sum glitcherz-* > sha256sums.txt
          cat sha256sums.txt

      - name: Compose release notes
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
            header="Commits since \`$prev\`:"
          else
            range="HEAD"
            header="First tagged build."
          fi
          # Literal "\n" sequences (a few old commit subjects have them) are
          # folded to spaces; super long subjects are clipped so one commit
          # cannot dominate the page.
          commits() {
            git log --no-merges --pretty='- %s (%h)' "$range" | sed -e 's/\\n/ /g' | cut -c1-160
          }
          {
            echo "## Changes"
            echo
            echo "$header"
            echo
            commits
            echo
            echo "## Downloads"
            echo
            echo "| Platform | Archive |"
            echo "| :--- | :--- |"
            echo "| Windows x86_64 | \`glitcherz-$VERSION-windows-x86_64.zip\` |"
            echo "| macOS (Apple Silicon + Intel) | \`glitcherz-$VERSION-macos-universal.tar.gz\` |"
            echo "| Linux x86_64 | \`glitcherz-$VERSION-linux-x86_64.tar.gz\` |"
            echo
            echo "Verify with \`sha256sum -c sha256sums.txt\` (Windows: \`Get-FileHash\`)."
            echo
            echo "## Runtime requirements"
            echo
            echo "- **Windows / macOS**: nothing extra, just unpack and run."
            echo "- **Linux**: needs ALSA, OpenGL and an X11 or Wayland session, e.g. on Debian/Ubuntu:"
            echo "  \`sudo apt install libasound2 libgl1 libxkbcommon0 libwayland-client0\`."
            echo "- CLAP / VST3 plugins are optional; point GlitcherZ at your plugin folders in the app."
          } > NOTES.md
          cat NOTES.md

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: GlitcherZ ${{ env.VERSION }}
          body_path: NOTES.md
          files: |
            dist/glitcherz-*
            dist/sha256sums.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
