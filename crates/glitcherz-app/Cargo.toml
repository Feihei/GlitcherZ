[package]
name = "glitcherz-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GlitcherZ DAW application entry point"

[[bin]]
name = "glitcherz"
path = "src/main.rs"

[dependencies]
glitcherz-engine = { workspace = true }
glitcherz-ui = { workspace = true }
# S4: the batch surface drives the command registry directly. Both crates are
# already in the dependency graph (glitcherz-ui depends on each), and
# serde_json has been in the lock file since the command crate landed, so the
# binary grows no new external dependency.
glitcherz-model = { workspace = true }
glitcherz-command = { workspace = true }
serde_json = "1"
env_logger = { workspace = true }
