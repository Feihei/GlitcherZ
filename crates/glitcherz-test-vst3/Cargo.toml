[package]
name = "glitcherz-test-vst3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GlitcherZ test VST3 sine instrument plugin (cdylib fixture for glitcherz-vst3-host tests)"

[lib]
# VST3 plugin = cdylib dynamic library (single-file .vst3 module on Windows)
crate-type = ["cdylib"]

[dependencies]
vst3 = { workspace = true }
log = { workspace = true }
