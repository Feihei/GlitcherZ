[package]
name = "glitcherz-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GlitcherZ audio engine: processing graph, scheduling, synthesizer and effects"

[dependencies]
cpal = { workspace = true }
rtrb = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
# SF2/SF3 sound font synthesis (S2+): loading/parsing (including Vorbis
# sample decode for SF3, via the sf3 feature) is control-thread only (sf2
# module); RT hot paths audited allocation-free in S1 (spec section 7).
rustysynth-ext = { workspace = true }
# wav decoding (U5 sample player / U6 audio track): control-thread only
# (sample module); the RT processor receives already-decoded f32 frames.
hound = { workspace = true }
