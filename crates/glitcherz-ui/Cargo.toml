[package]
name = "glitcherz-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GlitcherZ egui UI: transport, sequencer, piano roll, mixer"

[dependencies]
# On Windows, wgpu/Vulkan initialization can hang on a stale injection layer
# (e.g. RenderDoc); glow (OpenGL) is lighter and starts faster, so it is the
# default render backend.
# (eframe in the workspace is default-features = false + default_fonts.)
# persistence: eframe built-in storage (RON), used to persist the recent-files list
# x11 + wayland: dropped along with eframe's default features, but winit refuses
# to build on Linux unless one of them is on ("The platform you're compiling
# for is not supported by winit"). They are inert on Windows / macOS.
eframe = { workspace = true, features = [
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
log = { workspace = true }
rfd = { workspace = true }
glitcherz-clap-host = { workspace = true }
glitcherz-vst3-host = { workspace = true }
serde = { workspace = true }
serde_json = "1"
# Plugin-cache storage (eframe storage holds the encoded blob; spec
# `.agents/spec/plugin-browser.md` D11) — same text format as project files.
ron = { workspace = true }
glitcherz-engine = { workspace = true }
glitcherz-model = { workspace = true }
glitcherz-command = { workspace = true }

raw-window-handle = { workspace = true }
thiserror = { workspace = true }
# Offline wav export (U7, spec `.agents/spec/export-audio.md`): writing the
# 16-bit PCM render — same crate the engine's sample loader decodes with.
hound = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
